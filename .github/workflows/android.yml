name: Build AppMarket Packages

on:
  workflow_dispatch: # 支持网页端一键手动点击触发

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 编译免签名的 Debug APK（功能完整无阉割，手机开箱即装）
      - name: Build Debug APK
        run: ./gradlew :app:android:assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-Android-APK
          path: app/android/build/outputs/apk/debug/*.apk

  build-desktop:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Package Windows Desktop
        run: ./gradlew :app:desktop:packageDistributionForCurrentOS

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-Windows-Desktop
          path: app/desktop/build/compose/binaries/main/msi/*.msi
